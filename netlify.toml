[build]
publish = "dist"
command = "npm ci && npx playwright install chromium && npm run build"

[build.environment]
NODE_VERSION = "20.11.0"
NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
from = "http://*"
to = "https://:splat"
status = 301
force = true

[[redirects]]
from = "/junk-removal-pricing"
to = "/pricing"
status = 301

[[redirects]]
from = "/availability"
to = "/"
status = 301

[[redirects]]
from = "/specifications"
to = "/"
status = 301

[[redirects]]
from = "/privacy"
to = "/privacypolicy"
status = 301

[[redirects]]
from = "/terms"
to = "/termsandconditions"
status = 301

# Client-rendered routes that are not prerendered. Unknown paths fall through to 404.html.
[[redirects]]
from = "/admin"
to = "/index.html"
status = 200

[[redirects]]
from = "/admin/*"
to = "/index.html"
status = 200

[[redirects]]
from = "/mybookings"
to = "/index.html"
status = 200

[[redirects]]
from = "/success"
to = "/index.html"
status = 200

[[redirects]]
from = "/thank-you"
to = "/index.html"
status = 200

[[redirects]]
from = "/thank-you/"
to = "/index.html"
status = 200

[[redirects]]
from = "/ad"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(), microphone=(), camera=()"